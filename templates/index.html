
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 6px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Profit Prediction</h1>

    <form action="/predict" method="post">
        <label for="rnd">R&D Spend</label>
        <input type="number" id="rnd" name="rnd" step="any" required>

        <label for="admin">Administration Spend</label>
        <input type="number" id="admin" name="admin" step="any" required>

        <label for="marketing">Marketing Spend</label>
        <input type="number" id="marketing" name="marketing" step="any" required>

        <label for="state">State</label>
        <select id="state" name="state" required>
            <option value="" disabled selected>Select a state</option>
            <option value="0">New York</option>
            <option value="1">California</option>
            <option value="2">Florida</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
    <div class="result">
        <h2>Predicted Outcome</h2>
        <p>₹ {{ prediction_text }}</p>
    </div>
    {% endif %}
</body>
</html>
